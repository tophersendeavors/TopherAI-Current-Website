<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Intelligence Assessment — Discovery Interview · TopherAI</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ── Tokens ─────────────────────────────────────────────────── */
    :root {
      --plum-ink:      #1E1C24;
      --plum-alt:      #1A1821;
      --plum-deep:     #141219;
      --plum-lift:     #242130;
      --heart-coral:   #E8826B;
      --deep-coral:    #D26A52;
      --warm-cream:    #F3E9DD;
      --muted:         #C9BFB4;
      --dim:           #7A7270;
      --success:       #6FA98C;
      --warning:       #E0A458;
      --border:        rgba(243,233,221,0.07);
      --border-soft:   rgba(243,233,221,0.11);
      --border-coral:  rgba(232,130,107,0.22);

      --font-d: 'Quicksand', system-ui, sans-serif;
      --font-b: 'Hanken Grotesk', system-ui, sans-serif;
      --font-m: 'JetBrains Mono', ui-monospace, monospace;

      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 18px;
      --r-xl: 24px;

      --shadow-md: 0 8px 24px rgba(20,18,28,.30);
      --shadow-lg: 0 20px 48px rgba(20,18,28,.40);
      --glow: 0 0 0 1px rgba(232,130,107,.22), 0 8px 32px rgba(232,130,107,.22);

      --motion-fast:   160ms;
      --motion-base:   240ms;
      --motion-slow:   360ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-std: cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-b);
      background: var(--plum-deep);
      color: var(--warm-cream);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* ── Layout shell ────────────────────────────────────────────── */
    .shell {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: 56px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: 56px auto 1fr; }
    }

    /* ── Top bar ─────────────────────────────────────────────────── */
    .topbar {
      grid-column: 1 / -1;
      background: rgba(26,24,33,.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; gap: 16px;
      z-index: 10;
    }
    .topbar-brand {
      display: flex; align-items: center; gap: 9px;
      font-family: var(--font-d); font-size: 15px; font-weight: 700;
      color: var(--warm-cream); text-decoration: none;
    }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--heart-coral), var(--deep-coral));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: var(--plum-ink);
      box-shadow: 0 3px 10px rgba(232,130,107,.38);
      flex-shrink: 0;
    }
    .topbar-center {
      display: flex; align-items: center; gap: 10px;
      font-size: 12.5px; color: var(--muted);
    }
    .session-id {
      font-family: var(--font-m); font-size: 10.5px; color: var(--dim);
      padding: 3px 8px; border-radius: 5px;
      background: rgba(243,233,221,.04);
      border: 1px solid var(--border);
    }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .save-indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: 11.5px; color: var(--dim);
      font-family: var(--font-m);
    }
    .save-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success); transition: background var(--motion-base) var(--ease-std);
    }
    .save-dot.saving { background: var(--warning); animation: blink 0.9s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .4; } }
    .btn-sm {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: var(--r-sm);
      font-family: var(--font-b); font-size: 12px; font-weight: 500;
      border: 1px solid var(--border-soft); background: rgba(243,233,221,.04);
      color: var(--muted); cursor: pointer;
      transition: color var(--motion-fast) var(--ease-out),
                  background var(--motion-fast) var(--ease-out);
    }
    .btn-sm:hover { color: var(--warm-cream); background: rgba(243,233,221,.07); }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    .sidebar {
      background: rgba(26,24,33,.65);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px 16px;
      display: flex; flex-direction: column; gap: 4px;
    }
    @media (max-width: 860px) {
      .sidebar {
        display: none; /* shown via toggle on mobile */
      }
    }
    .sidebar-label {
      font-family: var(--font-m); font-size: 9.5px;
      letter-spacing: .14em; text-transform: uppercase;
      color: var(--dim); padding: 0 8px; margin-bottom: 8px;
    }
    .topic-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: var(--r-sm);
      cursor: pointer;
      transition: background var(--motion-fast) var(--ease-out);
      border: 1px solid transparent;
    }
    .topic-item:hover { background: rgba(243,233,221,.04); }
    .topic-item.active {
      background: rgba(232,130,107,.08);
      border-color: var(--border-coral);
    }
    .topic-item.completed .topic-icon { background: rgba(111,169,140,.14); color: var(--success); }
    .topic-item.active    .topic-icon { background: rgba(232,130,107,.14); color: var(--heart-coral); }
    .topic-icon {
      width: 26px; height: 26px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
      background: rgba(243,233,221,.05); color: var(--dim);
      transition: background var(--motion-base) var(--ease-std),
                  color var(--motion-base) var(--ease-std);
    }
    .topic-label {
      font-size: 12.5px; font-weight: 500;
      color: var(--muted); flex: 1;
      transition: color var(--motion-fast) var(--ease-out);
    }
    .topic-item.active    .topic-label { color: var(--warm-cream); }
    .topic-item.completed .topic-label { color: var(--muted); }
    .topic-check {
      width: 14px; height: 14px; color: var(--success);
      opacity: 0; transition: opacity var(--motion-base) var(--ease-std);
      flex-shrink: 0;
    }
    .topic-item.completed .topic-check { opacity: 1; }

    /* Overall progress */
    .progress-section { margin-bottom: 20px; }
    .progress-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .progress-title { font-size: 11.5px; color: var(--muted); font-weight: 500; }
    .progress-pct { font-family: var(--font-m); font-size: 11px; color: var(--heart-coral); }
    .progress-track {
      height: 3px; background: rgba(243,233,221,.08); border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--heart-coral), var(--deep-coral));
      border-radius: 99px;
      transition: width var(--motion-slow) var(--ease-out);
    }

    /* ── Main interview area ─────────────────────────────────────── */
    .main {
      overflow-y: auto;
      display: flex; flex-direction: column;
      background: var(--plum-ink);
      position: relative;
    }
    .main::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(700px 500px at 70% 10%, rgba(232,130,107,.07), transparent 60%);
    }
    .interview-wrap {
      flex: 1; display: flex; flex-direction: column;
      max-width: 720px; width: 100%;
      margin: 0 auto; padding: 40px 32px 120px;
      position: relative; z-index: 1;
    }
    @media (max-width: 600px) { .interview-wrap { padding: 24px 16px 100px; } }

    /* ── Start screen ────────────────────────────────────────────── */
    .start-screen {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 24px;
      padding: 48px 0;
      animation: fadeUp var(--motion-slow) var(--ease-out) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .agent-avatar {
      width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(135deg, var(--heart-coral), var(--deep-coral));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-d); font-size: 26px; font-weight: 700;
      color: var(--plum-ink); box-shadow: var(--shadow-md), var(--glow);
      position: relative;
    }
    .agent-pulse {
      position: absolute; inset: -4px; border-radius: 22px;
      border: 1px solid rgba(232,130,107,.30);
      animation: pulse-ring 2.4s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { opacity: .6; transform: scale(1); }
      50% { opacity: 0; transform: scale(1.08); }
    }
    .start-heading {
      font-family: var(--font-d); font-size: clamp(22px, 4vw, 30px);
      font-weight: 700; letter-spacing: -.02em; line-height: 1.15;
    }
    .start-sub {
      font-size: 15px; color: var(--muted); max-width: 460px; line-height: 1.65;
    }
    .start-meta {
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center;
      font-size: 12.5px; color: var(--dim);
    }
    .start-meta-item { display: flex; align-items: center; gap: 6px; }
    .btn-start {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--heart-coral), var(--deep-coral));
      color: var(--plum-ink); font-family: var(--font-b); font-weight: 600; font-size: 15px;
      padding: 14px 32px; border-radius: var(--r-md); border: none; cursor: pointer;
      box-shadow: var(--shadow-md), var(--glow);
      transition: transform var(--motion-fast) var(--ease-out),
                  box-shadow var(--motion-fast) var(--ease-out);
    }
    .btn-start:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg), var(--glow); }
    .btn-start:active { transform: translateY(0) scale(.99); }

    /* Topic pills on start screen */
    .topic-pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 520px; }
    .topic-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      font-size: 12px; color: var(--muted);
      background: rgba(243,233,221,.04);
      border: 1px solid var(--border);
    }

    /* ── Interview active state ──────────────────────────────────── */
    .interview-active { display: flex; flex-direction: column; gap: 0; }

    /* Message history */
    .history { display: flex; flex-direction: column; gap: 20px; margin-bottom: 24px; }

    /* Agent message */
    .msg-agent {
      display: flex; align-items: flex-start; gap: 12px;
      animation: fadeUp var(--motion-slow) var(--ease-out) both;
    }
    .msg-avatar-sm {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--heart-coral), var(--deep-coral));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-d); font-size: 13px; font-weight: 700;
      color: var(--plum-ink); margin-top: 2px;
    }
    .msg-bubble-agent {
      background: rgba(243,233,221,.04);
      border: 1px solid var(--border);
      border-radius: 4px var(--r-lg) var(--r-lg) var(--r-lg);
      padding: 14px 18px; max-width: 540px;
    }
    .msg-bubble-agent p { font-size: 15px; line-height: 1.65; color: var(--warm-cream); }
    .msg-bubble-agent .msg-meta {
      font-family: var(--font-m); font-size: 10px; color: var(--dim); margin-top: 8px;
    }

    /* Follow-up hints */
    .follow-up-hint {
      margin-top: 10px; padding: 10px 14px;
      background: rgba(232,130,107,.06);
      border: 1px solid var(--border-coral);
      border-radius: var(--r-sm);
      font-size: 12.5px; color: var(--muted);
      display: flex; align-items: flex-start; gap: 8px;
      animation: fadeUp var(--motion-base) var(--ease-out) both;
    }
    .follow-up-hint svg { color: var(--heart-coral); flex-shrink: 0; margin-top: 1px; }

    /* User message */
    .msg-user {
      display: flex; align-items: flex-start; gap: 12px;
      flex-direction: row-reverse;
      animation: fadeUp var(--motion-base) var(--ease-out) both;
    }
    .msg-user-icon {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      background: rgba(243,233,221,.08);
      border: 1px solid var(--border-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; margin-top: 2px;
    }
    .msg-bubble-user {
      background: rgba(243,233,221,.06);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-lg) 4px var(--r-lg) var(--r-lg);
      padding: 12px 16px; max-width: 480px;
    }
    .msg-bubble-user p { font-size: 14.5px; line-height: 1.6; color: var(--warm-cream); }
    .msg-bubble-user .msg-meta {
      font-family: var(--font-m); font-size: 10px; color: var(--dim); margin-top: 6px; text-align: right;
    }

    /* Thinking indicator */
    .thinking {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0;
      animation: fadeUp var(--motion-fast) var(--ease-out) both;
    }
    .thinking-dots { display: flex; gap: 5px; }
    .thinking-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--heart-coral); opacity: .4;
      animation: dot-pulse 1.2s ease-in-out infinite;
    }
    .thinking-dot:nth-child(2) { animation-delay: .18s; }
    .thinking-dot:nth-child(3) { animation-delay: .36s; }
    @keyframes dot-pulse {
      0%, 80%, 100% { opacity: .3; transform: scale(.85); }
      40% { opacity: 1; transform: scale(1); }
    }
    .thinking-label {
      font-size: 12px; color: var(--dim); font-family: var(--font-m);
    }

    /* ── Input zone ──────────────────────────────────────────────── */
    .input-zone {
      position: sticky; bottom: 0;
      background: linear-gradient(to top, var(--plum-ink) 70%, transparent);
      padding: 16px 0 24px; margin: 0 -32px;
      padding-left: 32px; padding-right: 32px;
    }
    @media (max-width: 600px) {
      .input-zone { margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
    }
    .input-wrap {
      background: rgba(243,233,221,.04);
      border: 1px solid var(--border-soft);
      border-radius: var(--r-lg);
      transition: border-color var(--motion-fast) var(--ease-out),
                  box-shadow var(--motion-fast) var(--ease-out);
      overflow: hidden;
    }
    .input-wrap:focus-within {
      border-color: rgba(232,130,107,.40);
      box-shadow: 0 0 0 3px rgba(232,130,107,.10);
    }
    .input-field {
      width: 100%; min-height: 64px; max-height: 180px;
      background: transparent; border: none; outline: none;
      font-family: var(--font-b); font-size: 15px;
      color: var(--warm-cream); resize: none;
      padding: 16px 18px 8px;
      line-height: 1.55;
    }
    .input-field::placeholder { color: var(--dim); }
    .input-actions {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px 12px;
    }
    .input-hint { font-size: 11.5px; color: var(--dim); font-family: var(--font-m); }
    .btn-send {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, var(--heart-coral), var(--deep-coral));
      color: var(--plum-ink); font-family: var(--font-b); font-weight: 600; font-size: 13px;
      padding: 9px 18px; border-radius: var(--r-sm); border: none; cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: transform var(--motion-fast) var(--ease-out),
                  opacity var(--motion-fast) var(--ease-out);
    }
    .btn-send:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }
    .btn-send:not(:disabled):hover { transform: translateY(-1px); }
    .btn-send:not(:disabled):active { transform: scale(.98); }

    /* Quick options (when agent offers choices) */
    .quick-opts {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
    }
    .quick-opt {
      padding: 8px 14px; border-radius: var(--r-sm);
      font-size: 13px; font-weight: 500; color: var(--muted);
      background: rgba(243,233,221,.04);
      border: 1px solid var(--border-soft); cursor: pointer;
      transition: color var(--motion-fast) var(--ease-out),
                  border-color var(--motion-fast) var(--ease-out),
                  background var(--motion-fast) var(--ease-out);
    }
    .quick-opt:hover {
      color: var(--warm-cream); border-color: var(--border-coral);
      background: rgba(232,130,107,.06);
    }
    .quick-opt.selected {
      color: var(--heart-coral); border-color: var(--border-coral);
      background: rgba(232,130,107,.10);
    }

    /* ── Completion screen ───────────────────────────────────────── */
    .complete-screen {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; gap: 28px; padding: 48px 0;
      animation: fadeUp var(--motion-slow) var(--ease-out) both;
    }
    .complete-icon {
      width: 72px; height: 72px; border-radius: 20px;
      background: rgba(111,169,140,.12);
      border: 1px solid rgba(111,169,140,.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      box-shadow: 0 0 32px rgba(111,169,140,.20);
    }
    .complete-heading {
      font-family: var(--font-d); font-size: clamp(22px, 4vw, 28px);
      font-weight: 700; letter-spacing: -.02em;
    }
    .complete-sub { font-size: 15px; color: var(--muted); max-width: 460px; line-height: 1.65; }
    .json-preview {
      width: 100%; max-height: 340px; overflow-y: auto;
      background: rgba(20,18,28,.8);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 18px 20px;
      text-align: left;
      font-family: var(--font-m); font-size: 12px; color: var(--muted);
      line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .complete-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn-primary-full {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--heart-coral), var(--deep-coral));
      color: var(--plum-ink); font-family: var(--font-b); font-weight: 600; font-size: 14px;
      padding: 12px 24px; border-radius: var(--r-md); border: none; cursor: pointer;
      box-shadow: var(--shadow-md), var(--glow);
      transition: transform var(--motion-fast) var(--ease-out);
    }
    .btn-primary-full:hover { transform: translateY(-2px); }
    .btn-ghost-full {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 11px 20px; border-radius: var(--r-md);
      font-family: var(--font-b); font-size: 14px; font-weight: 500;
      background: rgba(243,233,221,.04); border: 1px solid var(--border-soft);
      color: var(--muted); cursor: pointer;
      transition: color var(--motion-fast) var(--ease-out);
    }
    .btn-ghost-full:hover { color: var(--warm-cream); }

    /* ── Error toast ─────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      background: rgba(210,106,82,.14);
      border: 1px solid rgba(210,106,82,.35);
      border-radius: var(--r-md);
      padding: 12px 16px; max-width: 340px;
      font-size: 13.5px; color: var(--warm-cream); line-height: 1.5;
      box-shadow: var(--shadow-lg);
      animation: slideIn var(--motion-slow) var(--ease-out) both;
      display: none;
    }
    .toast.visible { display: flex; align-items: flex-start; gap: 10px; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .toast-close { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 16px; line-height: 1; padding: 0; margin-left: auto; }

    /* ── Scrollbar ───────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(243,233,221,.08); border-radius: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ── Focus styles (accessibility) ───────────────────────────── */
    :focus-visible {
      outline: 2px solid var(--heart-coral);
      outline-offset: 2px;
    }

    /* ── Divider ─────────────────────────────────────────────────── */
    .topic-divider {
      height: 1px; background: var(--border); margin: 6px 0;
    }
  </style>
</head>
<body>

<div class="shell" id="shell">

  <!-- Top Bar -->
  <header class="topbar" role="banner">
    <a href="https://topherai.com" class="topbar-brand" aria-label="TopherAI home">
      <div class="brand-mark" aria-hidden="true">T</div>
      Topher<span style="color:var(--heart-coral)">AI</span>
    </a>
    <div class="topbar-center">
      <span style="color:var(--dim); font-size:12px;">Business Intelligence Assessment</span>
      <span class="session-id" id="sessionId" aria-label="Session ID">—</span>
    </div>
    <div class="topbar-right">

/* ═══════════════════════════════════════════════════════════════════

const STATE = {

/* ═══════════════════════════════════════════════════════════════════
   UTILITIES
══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const now = () => new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
const sessionKey = () => CONFIG.storageKey + STATE.sessionId;

function generateSessionId() {
  return 'BIA-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2,6).toUpperCase();
}

function showToast(msg, duration = 5000) {
  const t = $('toast'), m = $('toastMsg');
  m.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), duration);
}
$('toastClose').onclick = () => $('toast').classList.remove('visible');

function setSaveState(saving) {
  const dot = $('saveDot'), lbl = $('saveLabel');
  if (saving) { dot.classList.add('saving'); lbl.textContent = 'Saving…'; }
  else { dot.classList.remove('saving'); lbl.textContent = 'Saved'; }
}

function autosave() {
  setSaveState(true);
  try {
    localStorage.setItem(sessionKey(), JSON.stringify({
      sessionId: STATE.sessionId,
      currentTopicIdx: STATE.currentTopicIdx,
      topicsCompleted: STATE.topicsCompleted,
      conversationHistory: STATE.conversationHistory,
      topicHistory: STATE.topicHistory,
      collectedData: STATE.collectedData,
      phase: STATE.phase,
      savedAt: new Date().toISOString(),
    }));
  } catch(e) { /* storage full or private mode */ }
  setTimeout(() => setSaveState(false), 600);
}

/* ═══════════════════════════════════════════════════════════════════
   SYSTEM PROMPT BUILDER
══════════════════════════════════════════════════════════════════ */
function buildSystemPrompt(topic) {
  const completedTopics = STATE.topicsCompleted.map(id => TOPICS.find(t => t.id === id)).filter(Boolean);
  const collectedSummary = Object.keys(STATE.collectedData).length > 0
    ? '\n\nData collected so far:\n' + JSON.stringify(STATE.collectedData, null, 2)
    : '';

  return `You are a Discovery Agent for TopherAI's Business Intelligence Assessment program. Your role is an expert AI business consultant conducting a structured intake interview with a small or medium business owner.

PERSONALITY AND TONE:
- Warm, professional, and genuinely curious — like a trusted consultant, not a form
- Ask one focused question at a time, never multiple questions in a row
- Reference what the owner said earlier to show you are listening
- Dig deeper when answers are vague or brief
- Keep your responses concise (2-4 sentences maximum for the question/prompt)
- Acknowledge interesting answers briefly before your next question
- Never use bullet points or numbered lists in your responses
- Never use jargon or AI buzzwords

CURRENT TOPIC: ${topic.label}
${topic.systemContext}

TOPICS COMPLETED: ${completedTopics.map(t => t.label).join(', ') || 'None yet'}
${collectedSummary}

IMPORTANT RULES:
1. Ask exactly one question per response
2. If the owner gives a brief or unclear answer, probe naturally: "Can you tell me more about that?" or "Roughly how often does that happen?"
3. If they mention a problem (missed calls, slow follow-up, scheduling chaos), investigate it — don't skip past it
4. When you feel you have enough on this topic (typically 4-6 exchanges), end with: "That gives me a good picture. [brief summary of what you learned]. Ready to move to [next topic]?"
5. Do not mention that you are an AI unless directly asked
6. Keep a consulting tone — you are helping them, not interrogating them

RESPONSE FORMAT: Plain conversational text only. No markdown, no lists, no bold, no headers.`;
}

/* ═══════════════════════════════════════════════════════════════════
   DATA EXTRACTION PROMPT
══════════════════════════════════════════════════════════════════ */
function buildExtractionPrompt(topicId) {
  const topic = TOPICS.find(t => t.id === topicId);
  const history = STATE.topicHistory[topicId] || [];
  const transcript = history.map(m => `${m.role === 'user' ? 'OWNER' : 'AGENT'}: ${m.content}`).join('\n');

  return `Extract structured data from this interview transcript about the topic "${topic.label}".

Transcript:
${transcript}

Return a JSON object only — no explanation, no markdown fences, just the raw JSON.
Extract values for these fields where mentioned: ${topic.seeds.join(', ')}.
Use null for fields not discussed. Use arrays for lists. Be faithful to what was actually said — do not infer or embellish.`;
}

/* ═══════════════════════════════════════════════════════════════════
   CLAUDE API CALLS
══════════════════════════════════════════════════════════════════ */
async function callClaude(messages, systemPrompt, maxTokens = CONFIG.max_tokens) {
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: CONFIG.model,
      max_tokens: maxTokens,
      system: systemPrompt,
      messages,
    }),
  });

  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`API error ${resp.status}: ${err}`);
  }
  const data = await resp.json();
  return data.content?.[0]?.text || '';
}

async function extractTopicData(topicId) {
  try {
    const extraction = await callClaude(
      [{ role: 'user', content: buildExtractionPrompt(topicId) }],
      'You are a data extraction assistant. Return only valid JSON, no markdown fences.',
      600
    );
    // Clean any accidental markdown
    const cleaned = extraction.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);
    STATE.collectedData[topicId] = parsed;
    autosave();
  } catch(e) {
    console.warn('Data extraction failed for', topicId, e);
    // Non-fatal — interview continues
  }
}

function showQuickOpts(opts) {
  const slot = $('quickOptsSlot');
  if (!slot || !opts || opts.length === 0) { if (slot) slot.innerHTML = ''; return; }
  STATE.quickOpts = opts;
  STATE.selectedOpts = [];
  slot.innerHTML = `<div class="quick-opts" role="group" aria-label="Quick answer options">${
    opts.map((o, i) => `<button class="quick-opt" data-idx="${i}" aria-label="Select: ${o}">${escHtml(o)}</button>`).join('')
  }</div>`;
  slot.querySelectorAll('.quick-opt').forEach(btn => {
    btn.onclick = () => {
      const idx = +btn.dataset.idx;
      const val = STATE.quickOpts[idx];
      const field = $('inputField');
      if (!field) return;
      // Toggle
      if (STATE.selectedOpts.includes(val)) {
        STATE.selectedOpts = STATE.selectedOpts.filter(v => v !== val);
        btn.classList.remove('selected');
      } else {
        STATE.selectedOpts.push(val);
        btn.classList.add('selected');
      }
      // Build text
      field.value = STATE.selectedOpts.join(', ');
      field.dispatchEvent(new Event('input'));
    };
  });
}

function scrollToBottom() {
  const main = $('mainArea');
  if (main) main.scrollTo({ top: main.scrollHeight, behavior: 'smooth' });
}

function setInputDisabled(disabled) {
  const field = $('inputField'), btn = $('sendBtn');
  if (!field || !btn) return;
  field.disabled = disabled;
  btn.disabled = disabled || field.value.trim().length === 0;
  STATE.isLoading = disabled;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g,'<br>');
}

/* ═══════════════════════════════════════════════════════════════════
   INTERVIEW ENGINE
══════════════════════════════════════════════════════════════════ */
async function startInterview() {
  STATE.phase = 'interview';
  STATE.currentTopicIdx = 0;
  STATE.topicsCompleted = [];
  STATE.conversationHistory = [];
  STATE.topicHistory = {};
  STATE.collectedData = {};
  STATE.exchangeCount = 0;

  renderInterviewScreen();
  renderSidebar();

  // Brief delay for render, then get opening question
  await delay(200);
  await getNextAgentMessage(true);
}

async function getNextAgentMessage(isOpening = false) {
  const topic = TOPICS[STATE.currentTopicIdx];
  if (!topic) {
    await concludeInterview();
    return;
  }

  setInputDisabled(true);
  showThinking(true);

  try {
    // Build messages for this turn
    const messages = buildMessages(isOpening);
    const systemPrompt = buildSystemPrompt(topic);

    const response = await callClaude(messages, systemPrompt);

    showThinking(false);
    addMessage('agent', response);

    // Track in full history and topic history
    const agentMsg = { role: 'assistant', content: response };
    STATE.conversationHistory.push(agentMsg);
    if (!STATE.topicHistory[topic.id]) STATE.topicHistory[topic.id] = [];
    STATE.topicHistory[topic.id].push(agentMsg);

    // Detect if agent is signaling topic completion
    const signalsTransition = detectTopicTransition(response);
    if (signalsTransition) {
      // Extract data for this topic in background, then show "next topic" UI
      extractTopicData(topic.id);
      setTimeout(() => showTopicTransitionUI(topic), 800);
    } else {
      // Check if we've hit max exchanges and should auto-advance
      if (STATE.exchangeCount >= CONFIG.maxExchangesPerTopic) {
        extractTopicData(topic.id);
        setTimeout(() => showTopicTransitionUI(topic), 300);
      } else {
        setInputDisabled(false);
        $('inputField')?.focus();
      }
    }

    autosave();
  } catch(e) {
    showThinking(false);
    setInputDisabled(false);
    showToast('Connection issue — please try again. Your progress is saved.');
    console.error('Claude API error:', e);
  }
}

function buildMessages(isOpening) {
  const topic = TOPICS[STATE.currentTopicIdx];
  const prevMsgs = STATE.conversationHistory.slice(-12); // keep context window manageable

  if (isOpening && STATE.conversationHistory.length === 0) {
    // Very first message — cold open
    return [{
      role: 'user',
      content: `Please begin the interview. Start with a warm greeting, briefly explain what we'll cover today (business overview → goals, adapting as we go), and then ask your first question about the business.`,
    }];
  }

  if (isOpening && STATE.topicsCompleted.length > 0) {
    // Opening a new topic after completing the previous one
    const prevTopic = TOPICS[STATE.currentTopicIdx - 1];
    return [
      ...prevMsgs,
      {
        role: 'user',
        content: `The user confirmed they're ready to move on. Please transition naturally to the next topic: ${topic.label}. Reference something from the earlier conversation if it connects, then ask your first question about this topic.`,
      }
    ];
  }

  return prevMsgs;
}

function detectTopicTransition(response) {
  const r = response.toLowerCase();
  return (
    r.includes('ready to move') ||
    r.includes('move to') ||
    r.includes('move on to') ||
    r.includes('let\'s move') ||
    r.includes('next topic') ||
    r.includes('next area') ||
    r.includes('shift to') ||
    r.includes('good picture') && STATE.exchangeCount >= 3
  );
}

async function sendMessage() {
  const field = $('inputField');
  if (!field) return;
  const text = field.value.trim();
  if (!text || STATE.isLoading) return;

  // Clear opts selection
  showQuickOpts([]);

  field.value = '';
  field.style.height = 'auto';
  setInputDisabled(true);

  addMessage('user', text);

  const topic = TOPICS[STATE.currentTopicIdx];
  const userMsg = { role: 'user', content: text };
  STATE.conversationHistory.push(userMsg);
  if (!STATE.topicHistory[topic.id]) STATE.topicHistory[topic.id] = [];
  STATE.topicHistory[topic.id].push(userMsg);
  STATE.exchangeCount++;

  await getNextAgentMessage(false);
}

function showTopicTransitionUI(completedTopic) {
  // Mark topic complete
  if (!STATE.topicsCompleted.includes(completedTopic.id)) {
    STATE.topicsCompleted.push(completedTopic.id);
  }

  const nextTopicIdx = STATE.currentTopicIdx + 1;
  const nextTopic = TOPICS[nextTopicIdx];

  const slot = $('quickOptsSlot');
  if (!slot) return;

  if (!nextTopic) {
    // All topics done
    slot.innerHTML = `
      <div class="follow-up-hint" role="status">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span>We've covered everything. Click <strong>Complete Interview</strong> to finalize.</span>
      </div>
      <div style="margin-top:12px;">
        <button class="btn-primary-full" id="completeBtn">Complete Interview</button>
      </div>`;
    $('completeBtn').onclick = concludeInterview;
    renderSidebar();
    return;
  }

  slot.innerHTML = `
    <div class="follow-up-hint" role="status">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      <span>Next topic: <strong>${nextTopic.icon} ${nextTopic.label}</strong> — ${nextTopic.description}</span>
    </div>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;">
      <button class="btn-primary-full" id="nextTopicBtn">Continue →</button>
      <button class="btn-ghost-full" id="stayBtn">I have more to add</button>
    </div>`;

  $('nextTopicBtn').onclick = () => advanceTopic(nextTopicIdx);
  $('stayBtn').onclick = () => {
    slot.innerHTML = '';
    setInputDisabled(false);
    $('inputField')?.focus();
    // Don't increment exchangeCount so we don't immediately re-trigger
    STATE.exchangeCount = 0;
  };

  renderSidebar();
}

async function advanceTopic(newIdx) {
  STATE.currentTopicIdx = newIdx;
  STATE.exchangeCount = 0;
  showQuickOpts([]);

  // Divider between topics
  const history = $('history');
  if (history) {
    const div = document.createElement('div');
    div.style.cssText = 'display:flex;align-items:center;gap:12px;margin:16px 0;';
    div.setAttribute('aria-hidden', 'true');
    div.innerHTML = `
      <div style="flex:1;height:1px;background:var(--border);"></div>
      <span style="font-family:var(--font-m);font-size:10px;color:var(--dim);padding:4px 12px;border-radius:99px;background:rgba(243,233,221,.04);border:1px solid var(--border);">${TOPICS[newIdx].icon} ${TOPICS[newIdx].label}</span>
      <div style="flex:1;height:1px;background:var(--border);"></div>`;
    history.appendChild(div);
  }

  renderSidebar();
  await getNextAgentMessage(true);
}

async function concludeInterview() {
  STATE.phase = 'complete';

  // Mark all remaining as complete
  TOPICS.forEach(t => {
    if (!STATE.topicsCompleted.includes(t.id)) STATE.topicsCompleted.push(t.id);
  });
  renderSidebar();

  // Build final JSON
  const finalOutput = buildFinalJSON();

  const wrap = $('interviewWrap');
  wrap.innerHTML = `
    <div class="complete-screen">
      <div class="complete-icon" aria-hidden="true">✓</div>
      <h2 class="complete-heading">Interview complete.</h2>
      <p class="complete-sub">
        Thank you for your time. Your answers have been compiled into a structured assessment profile — ready for analysis. Our team will be in touch within 48 hours.
      </p>

      <div style="width:100%;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-family:var(--font-m);font-size:10.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;">Structured Output — Discovery Profile</span>
          <button class="btn-sm" id="copyJsonBtn" aria-label="Copy JSON to clipboard">Copy JSON</button>
        </div>
        <pre class="json-preview" id="jsonPreview" tabindex="0" aria-label="Interview data in JSON format">${escHtml(JSON.stringify(finalOutput, null, 2))}</pre>
      </div>

      <div class="complete-actions">
        <button class="btn-primary-full" onclick="window.location.href='mailto:hello@topherai.com?subject=BIA Discovery Profile ${STATE.sessionId}&body=Please find my discovery profile attached.'" aria-label="Email profile to TopherAI team">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          Email to TopherAI
        </button>
        <button class="btn-ghost-full" id="downloadBtn" aria-label="Download JSON file">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download JSON
        </button>
        <button class="btn-ghost-full" id="newInterviewBtn" aria-label="Start a new interview session">
          Start new interview
        </button>
      </div>
      <p style="font-size:12px;color:var(--dim);">Session ID: <span style="font-family:var(--font-m);">${STATE.sessionId}</span></p>
    </div>`;

  $('copyJsonBtn').onclick = () => {
    navigator.clipboard?.writeText(JSON.stringify(finalOutput, null, 2))
      .then(() => { $('copyJsonBtn').textContent = 'Copied!'; setTimeout(() => $('copyJsonBtn').textContent = 'Copy JSON', 2000); })
      .catch(() => showToast('Could not copy — please select and copy manually.'));
  };

  $('downloadBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(finalOutput, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `topherai-discovery-${STATE.sessionId}.json`;
    a.click(); URL.revokeObjectURL(url);
  };

  $('newInterviewBtn').onclick = () => {
    initSession();
    renderSidebar();
    renderStartScreen();
  };

  $('exportBtn').style.display = 'flex';
  $('exportBtn').onclick = () => $('downloadBtn')?.click();

  autosave();
}

function buildFinalJSON() {
  return {
    _meta: {
      version: '1.0.0',
      session_id: STATE.sessionId,
      completed_at: new Date().toISOString(),
      topics_completed: STATE.topicsCompleted,
      agent: 'TopherAI Discovery Agent',
      schema: 'bia_discovery_v1',
    },
    business_overview:   STATE.collectedData['overview']      || null,
    customers:           STATE.collectedData['customers']     || null,
    sales:               STATE.collectedData['sales']         || null,
    marketing:           STATE.collectedData['marketing']     || null,
    customer_service:    STATE.collectedData['customer_service'] || null,
    operations:          STATE.collectedData['operations']    || null,
    staffing:            STATE.collectedData['staffing']      || null,
    technology:          STATE.collectedData['technology']    || null,
    goals:               STATE.collectedData['goals']         || null,
    // Raw transcript for downstream agents that want full context
    _transcript: STATE.conversationHistory.map(m => ({
      role: m.role,
      content: m.content,
    })),
  };
}

/* ═══════════════════════════════════════════════════════════════════
   SESSION MANAGEMENT
══════════════════════════════════════════════════════════════════ */
function initSession() {
  STATE.sessionId = generateSessionId();
  STATE.phase = 'start';
  STATE.currentTopicIdx = 0;
  STATE.topicsCompleted = [];
  STATE.conversationHistory = [];
  STATE.topicHistory = {};
  STATE.collectedData = {};
  STATE.exchangeCount = 0;
  STATE.isLoading = false;
  $('sessionId').textContent = STATE.sessionId;
  $('exportBtn').style.display = 'none';
}

function tryRestoreSession() {
  // Look for most recent saved session
  const keys = Object.keys(localStorage).filter(k => k.startsWith(CONFIG.storageKey));
  if (keys.length === 0) return false;

  // Sort by session ID (timestamp embedded) and take most recent
  keys.sort().reverse();
  try {
    const saved = JSON.parse(localStorage.getItem(keys[0]));
    if (!saved || saved.phase === 'complete') return false;

    Object.assign(STATE, {
      sessionId: saved.sessionId,
      currentTopicIdx: saved.currentTopicIdx,
      topicsCompleted: saved.topicsCompleted || [],
      conversationHistory: saved.conversationHistory || [],
      topicHistory: saved.topicHistory || {},
      collectedData: saved.collectedData || {},
      phase: saved.phase || 'start',
    });
    $('sessionId').textContent = STATE.sessionId;
    return saved.phase === 'interview';
  } catch(e) { return false; }
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ═══════════════════════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════════════════════ */
(function boot() {
  const hasSession = tryRestoreSession();

  if (hasSession) {
    // Resume interrupted session
    renderSidebar();
    renderInterviewScreen();

    // Replay history into the DOM
    STATE.conversationHistory.forEach(m => {
      addMessage(m.role === 'assistant' ? 'agent' : 'user', m.content);
    });

    // Show resume banner
    const history = $('history');
    if (history) {
      const banner = document.createElement('div');
      banner.className = 'follow-up-hint';
      banner.setAttribute('role', 'status');
      banner.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/></svg>
        <span>Session restored. Continue where you left off.</span>`;
      history.appendChild(banner);
    }

    setInputDisabled(false);
    $('inputField')?.focus();
    scrollToBottom();
  } else {
    initSession();
    renderSidebar();
    renderStartScreen();
  }
})();
</script>
