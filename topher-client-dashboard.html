  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Calm warm palette — feels human, not corporate */
      --bg: #faf8f4;
      --paper: #fffefc;
      --ink: #1a1a1f;
      --ink-soft: #3d3d47;
      --ink-mute: #6b6b78;
      --ink-dim: #9a9aa6;
      --line: rgba(26,26,31,0.07);
      --line-strong: rgba(26,26,31,0.13);
      
      --accent: #c2410c;        /* warm copper */
      --accent-soft: #fed7aa;
      --accent-deep: #9a3412;
      
      --sage: #4f7a55;          /* nature green for booked */
      --sage-soft: #d1e3d4;
      --rose: #be4b58;          /* signal red for urgent */
      --rose-soft: #f7d4d8;
      --gold: #b48226;          /* attention yellow */
      --gold-soft: #f3e3b8;
      --indigo: #4f5d8a;
      --indigo-soft: #d8dde8;
    }
    
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      letter-spacing: -0.005em;
      min-height: 100vh;
      font-feature-settings: 'ss01' 1, 'cv11' 1;
    }
    
    .font-display { 
      font-family: 'Fraunces', Georgia, serif; 
      font-optical-sizing: auto;
      letter-spacing: -0.025em;
    }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    
    /* Editorial paper texture */
    .paper {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(26,26,31,0.025);
    }
    .paper-hover:hover { 
      border-color: var(--line-strong);
      box-shadow: 0 4px 16px rgba(26,26,31,0.05);
      transform: translateY(-1px);
    }
    .paper-hover { transition: all 0.2s; }
    
    /* Eyebrow label */
    .eyebrow {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-dim);
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* Buttons */
    button { 
      font-family: inherit; 
      cursor: pointer; 
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--ink);
      color: var(--paper);
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .btn-primary:hover {
      background: var(--accent-deep);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--line-strong);
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .btn-secondary:hover {
      border-color: var(--ink);
      background: var(--paper);
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--paper);
      border: 1px solid var(--line-strong);
      color: var(--ink);
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 500;
      text-decoration: none;
    }
    .btn-action:hover {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .btn-action.primary {
      background: var(--accent);
      color: var(--paper);
      border-color: var(--accent);
    }
    .btn-action.primary:hover {
      background: var(--accent-deep);
      border-color: var(--accent-deep);
    }
    .btn-action.danger {
      color: var(--rose);
      border-color: var(--rose-soft);
    }
    .btn-action.danger:hover {
      background: var(--rose);
      color: var(--paper);
      border-color: var(--rose);
    }
    
    /* Status chips */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 999px;
      letter-spacing: 0.01em;
      border: 1px solid;
    }
    .chip-hot     { background: var(--rose-soft);   color: var(--rose);   border-color: var(--rose); }
    .chip-warm    { background: var(--gold-soft);   color: var(--gold);   border-color: var(--gold); }
    .chip-cool    { background: var(--indigo-soft); color: var(--indigo); border-color: var(--indigo); }
    .chip-booked  { background: var(--sage-soft);   color: var(--sage);   border-color: var(--sage); }
    .chip-neutral { background: var(--bg);          color: var(--ink-mute); border-color: var(--line-strong); }
    
    /* Lead cards */
    .lead-card {
      padding: 18px 20px;
      cursor: pointer;
      position: relative;
      border-left: 3px solid transparent;
    }
    .lead-card.urgent { border-left-color: var(--rose); }
    .lead-card.hot { border-left-color: var(--gold); }
    .lead-card.booked-card { border-left-color: var(--sage); }
    
    /* Stat cards */
    .stat {
      padding: 22px 24px;
    }
    .stat-num {
      font-family: 'Fraunces', serif;
      font-optical-sizing: auto;
      font-variation-settings: 'opsz' 96, 'SOFT' 50;
      font-weight: 400;
      font-size: 48px;
      line-height: 1;
      letter-spacing: -0.04em;
    }
    
    /* Inputs */
    .input, .textarea, .select {
      width: 100%;
      background: var(--paper);
      border: 1px solid var(--line-strong);
      color: var(--ink);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border 0.15s;
    }
    .input:focus, .textarea:focus, .select:focus {
      border-color: var(--accent);
    }
    .textarea {
      resize: vertical;
      min-height: 70px;
      font-family: 'Inter Tight', sans-serif;
      line-height: 1.5;
    }
    
    /* Tabs */
    .tab {
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: 999px;
      border: 1px solid transparent;
      color: var(--ink-mute);
      background: transparent;
    }
    .tab:hover { color: var(--ink); background: var(--paper); }
    .tab.active {
      background: var(--ink);
      color: var(--paper);
    }
    .tab .count {
      display: inline-block;
      margin-left: 4px;
      font-size: 10.5px;
      opacity: 0.6;
      font-family: 'JetBrains Mono', monospace;
    }
    .tab.active .count { opacity: 0.8; }
    
    /* Tags */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      font-size: 11px;
      background: var(--bg);
      border: 1px solid var(--line-strong);
      color: var(--ink-soft);
      border-radius: 5px;
    }
    .tag-remove {
      background: transparent;
      border: none;
      color: var(--ink-dim);
      cursor: pointer;
      padding: 0;
      font-size: 13px;
      line-height: 1;
      margin-left: 2px;
    }
    .tag-remove:hover { color: var(--rose); }
    
    /* Conversation bubbles */
    .bubble {
      max-width: 78%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .bubble-them {
      background: var(--bg);
      border-bottom-left-radius: 5px;
      align-self: flex-start;
      color: var(--ink);
    }
    .bubble-us {
      background: var(--ink);
      color: var(--paper);
      border-bottom-right-radius: 5px;
      align-self: flex-end;
    }
    .bubble-meta {
      font-size: 10.5px;
      color: var(--ink-dim);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 3px;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(26,26,31,0.10); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(26,26,31,0.20); }
    
    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .reveal > * {
      animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    .reveal > *:nth-child(1) { animation-delay: 0.02s; }
    .reveal > *:nth-child(2) { animation-delay: 0.05s; }
    .reveal > *:nth-child(3) { animation-delay: 0.08s; }
    .reveal > *:nth-child(4) { animation-delay: 0.12s; }
    .reveal > *:nth-child(5) { animation-delay: 0.15s; }
    .reveal > *:nth-child(6) { animation-delay: 0.18s; }
    
    @keyframes saveBlip {
      0% { opacity: 0; transform: translate(-50%, 6px) scale(0.95); }
      15%, 80% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -6px) scale(0.95); }
    }
    .save-blip {
      position: fixed;
      bottom: 26px;
      left: 50%;
      background: var(--sage);
      color: var(--paper);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(79,122,85,0.25);
      animation: saveBlip 1.8s ease;
      z-index: 1000;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--sage);
      animation: pulse 2s ease-in-out infinite;
      display: inline-block;
    }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26,26,31,0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal {
      background: var(--paper);
      border-radius: 18px;
      padding: 28px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
    }
    
    /* Empty state */
    .empty-state {
      padding: 60px 24px;
      text-align: center;
    }
    .empty-icon {
      font-size: 36px;
      opacity: 0.4;
      margin-bottom: 12px;
    }
    
    /* Login */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: 
        radial-gradient(800px 500px at 80% 20%, rgba(194,65,12,0.06), transparent 60%),
        radial-gradient(700px 400px at 10% 80%, rgba(79,122,85,0.06), transparent 60%),
        var(--bg);
    }
    .login-card {
      max-width: 380px;
      width: 100%;
      padding: 36px 32px;
    }
  </style>
</head>
<body>

<div id="app"></div>

<div id="boot-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);z-index:9999;">
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="live-dot"></div>
    <span style="font-size:13px;color:var(--ink-mute);font-family:'JetBrains Mono',monospace;">Loading</span>
  </div>
  <div id="boot-error" style="font-size:12px;color:var(--rose);font-family:'JetBrains Mono',monospace;display:none;max-width:600px;text-align:center;padding:0 20px;"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// Topher AI — Client Dashboard
// ═══════════════════════════════════════════════════════

(function() {
  'use strict';
  
  function bootError(msg) {
    const el = document.getElementById('boot-error');
    if (el) { el.textContent = msg; el.style.display = 'block'; }
    console.error('[boot]', msg);
  }
  
  if (!window.supabase) { bootError('Supabase library failed to load.'); return; }
  if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
    bootError('Supabase credentials missing.'); return;
  }
  
  let db;
  try {
    db = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  } catch (e) { bootError('Init failed: ' + e.message); return; }
  
  const SESSION_KEY = 'topher_client_auth_v1';
  
  const state = {
    authenticated: false,
    contacts: [],
    calls: [],
    sms: [],
    activity: [],
    view: 'inbox',          // inbox | all | followups | calendar
    selectedId: null,
    searchQuery: '',
    showModal: null,        // { type: 'reminder' | 'tag', contactId }
    saveMessage: null,
    loading: true,
    error: null,
    lastRefresh: null
  };
  
  // ─────── Helpers ───────
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  
  function escapeAttr(s) {
    return escapeHtml(s).replace(/`/g, '&#96;');
  }
  
  const fmt = {
    phone: (p) => {
      if (!p) return '—';
      if (p.startsWith('web:')) return 'Web Visitor';
      const d = p.replace(/\D/g, '');
      if (d.length === 11 && d[0] === '1') return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
      if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
      return p;
    },
    when: (ts) => {
      if (!ts) return '';
      const d = new Date(ts);
      const sec = Math.floor((Date.now() - d.getTime()) / 1000);
      if (sec < 60) return 'moments ago';
      if (sec < 3600) return Math.floor(sec/60) + ' min ago';
      if (sec < 86400) return Math.floor(sec/3600) + 'h ago';
      if (sec < 172800) return 'yesterday';
      if (sec < 604800) return Math.floor(sec/86400) + 'd ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    },
    fullDate: (ts) => {
      if (!ts) return '—';
      return new Date(ts).toLocaleString('en-US', { 
        month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' 
      });
    },
    timeOnly: (ts) => {
      if (!ts) return '';
      return new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    },
    dateOnly: (ts) => {
      if (!ts) return '';
      return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    },
    industry: (s) => {
      if (!s) return '';
      return s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    },
    money: (n) => {
      if (!n) return '';
      return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
    },
    greeting: () => {
      const h = new Date().getHours();
      if (h < 12) return 'Good morning';
      if (h < 18) return 'Good afternoon';
      return 'Good evening';
    }
  };
  
  function urgencyChip(c) {
    const u = (c.urgency || '').toLowerCase();
    if (u === 'hot') return '<span class="chip chip-hot">🔥 Hot Lead</span>';
    if (u === 'warm') return '<span class="chip chip-warm">Warm</span>';
    if (u === 'cold') return '<span class="chip chip-cool">Cold</span>';
    return '';
  }
  
  function statusChip(c) {
    const fs = (c.follow_up_status || '').toLowerCase();
    const ls = (c.lead_status || '').toLowerCase();
    
    if (fs === 'booked' || ls === 'booked' || ls === 'demo_scheduled')
      return '<span class="chip chip-booked">📅 Booked</span>';
    if (fs === 'won') return '<span class="chip chip-booked">✓ Won</span>';
    if (fs === 'lost') return '<span class="chip chip-neutral">Closed</span>';
    if (fs === 'followed_up') return '<span class="chip chip-cool">Followed Up</span>';
    if (ls === 'opted_out') return '<span class="chip chip-neutral">Opted Out</span>';
    if (ls === 'qualified') return '<span class="chip chip-warm">Qualified</span>';
    if (!c.last_action_at) return '<span class="chip chip-warm">Needs You</span>';
    return '';
  }
  
  // ─────── Data ───────
  async function load() {
    state.loading = true;
    if (state.authenticated) render();
    
    try {
      const [contactsRes, callsRes, smsRes, activityRes] = await Promise.all([
        db.from('contacts').select('*').order('created_at', { ascending: false }).limit(500),
        db.from('calls').select('*').order('created_at', { ascending: false }).limit(300),
        db.from('sms_messages').select('*').order('created_at', { ascending: false }).limit(500),
        db.from('contact_activity').select('*').order('created_at', { ascending: false }).limit(200).then(r => r).catch(() => ({ data: [], error: null }))
      ]);
      
      if (contactsRes.error) throw new Error('Contacts: ' + contactsRes.error.message);
      if (callsRes.error) throw new Error('Calls: ' + callsRes.error.message);
      if (smsRes.error) throw new Error('SMS: ' + smsRes.error.message);
      
      state.contacts = contactsRes.data || [];
      state.calls = callsRes.data || [];
      state.sms = smsRes.data || [];
      state.activity = (activityRes && activityRes.data) || [];
      state.error = null;
      state.lastRefresh = new Date();
    } catch (e) {
      state.error = e.message;
    }
    
    state.loading = false;
    if (state.authenticated) render();
  }
  
  async function logActivity(contactId, actionType, actionData) {
    try {
      await db.from('contact_activity').insert({
        contact_id: contactId,
        actor: window.BUSINESS_OWNER_NAME || 'owner',
        action_type: actionType,
        action_data: actionData
      });
    } catch (e) {
      console.warn('Activity log failed (non-blocking):', e);
    }
  }
  
  async function updateContact(id, fields, activityType) {
    try {
      const updates = { 
        ...fields, 
        updated_at: new Date().toISOString(),
        last_action_at: new Date().toISOString(),
        last_action_by: window.BUSINESS_OWNER_NAME || 'owner'
      };
      
      const { error } = await db.from('contacts').update(updates).eq('id', id);
      if (error) throw error;
      
      // Local update
      state.contacts = state.contacts.map(c => 
        c.id === id ? { ...c, ...updates } : c
      );
      
      // Activity log
      if (activityType) {
        await logActivity(id, activityType, fields);
      }
      
      flashSave('Saved');
      render();
      return true;
    } catch (e) {
      flashSave('Error: ' + e.message, true);
      return false;
    }
  }
  
  function flashSave(msg, isError) {
    state.saveMessage = msg;
    render();
    setTimeout(() => {
      state.saveMessage = null;
      render();
    }, isError ? 3000 : 1500);
  }
  
  // ─────── Computed views ───────
  function inboxLeads() {
    // "Needs your attention" — leads with action signal that haven't been touched yet
    return state.contacts.filter(c => {
      const fs = (c.follow_up_status || '').toLowerCase();
      const ls = (c.lead_status || '').toLowerCase();
      
      // Exclude already-handled leads
      if (['won', 'lost', 'followed_up'].includes(fs)) return false;
      if (['opted_out', 'dead', 'closed'].includes(ls)) return false;
      
      // Include if they're hot OR qualified OR have a recent call
      if (c.urgency === 'hot') return true;
      if (['qualified', 'demo_scheduled', 'booked'].includes(ls)) return true;
      if (c.last_call_at) {
        const hours = (Date.now() - new Date(c.last_call_at)) / 3600000;
        if (hours < 48) return true;
      }
      return false;
    }).sort((a, b) => {
      // Hot first, then most recent
      const aHot = a.urgency === 'hot' ? 1 : 0;
      const bHot = b.urgency === 'hot' ? 1 : 0;
      if (aHot !== bHot) return bHot - aHot;
      const aTime = new Date(a.last_call_at || a.created_at).getTime();
      const bTime = new Date(b.last_call_at || b.created_at).getTime();
      return bTime - aTime;
    });
  }
  
  function dueCallbacks() {
    const now = Date.now();
    return state.contacts
      .filter(c => c.callback_at && new Date(c.callback_at).getTime() <= now + 24*3600*1000)
      .sort((a, b) => new Date(a.callback_at) - new Date(b.callback_at));
  }
  
  function filteredContacts() {
    let list = [...state.contacts];
    
    // View filter
    if (state.view === 'followups') {
      list = list.filter(c => c.callback_at);
      list.sort((a, b) => new Date(a.callback_at) - new Date(b.callback_at));
    } else if (state.view === 'booked') {
      list = list.filter(c => {
        const fs = (c.follow_up_status || '').toLowerCase();
        const ls = (c.lead_status || '').toLowerCase();
        return fs === 'booked' || fs === 'won' || ls === 'booked' || ls === 'demo_scheduled';
      });
    } else if (state.view === 'inbox') {
      return inboxLeads();
    }
    
    // Search
    if (state.searchQuery) {
      const q = state.searchQuery.toLowerCase();
      list = list.filter(c => 
        (c.name || '').toLowerCase().includes(q) ||
        (c.email || '').toLowerCase().includes(q) ||
        (c.phone || '').includes(q) ||
        (c.business_name || '').toLowerCase().includes(q) ||
        (c.notes || '').toLowerCase().includes(q) ||
        (c.tags || []).some(t => t.toLowerCase().includes(q))
      );
    }
    
    return list;
  }
  
  function selectedContact() {
    return state.contacts.find(c => c.id === state.selectedId);
  }
  
  function contactConversation(contact) {
    if (!contact) return [];
    
    // Merge calls and SMS into a single timeline
    const items = [];
    
    state.calls.filter(c => c.caller_phone === contact.phone).forEach(c => {
      items.push({
        type: 'call',
        at: c.created_at,
        data: c
      });
    });
    
    state.sms.filter(s => 
      s.to_number === contact.phone || s.from_number === contact.phone
    ).forEach(s => {
      items.push({
        type: 'sms',
        at: s.created_at,
        data: s,
        direction: s.direction
      });
    });
    
    return items.sort((a, b) => new Date(a.at) - new Date(b.at));
  }
  
  function contactActivity(contact) {
    if (!contact) return [];
    return state.activity.filter(a => a.contact_id === contact.id);
  }
  
  function todayStats() {
    const today = new Date();
    today.setHours(0,0,0,0);
    
    const newLeads = state.contacts.filter(c => new Date(c.created_at) >= today).length;
    const calls = state.calls.filter(c => new Date(c.created_at) >= today).length;
    const booked = state.contacts.filter(c => {
      const fs = (c.follow_up_status || '').toLowerCase();
      const ls = (c.lead_status || '').toLowerCase();
      return (fs === 'booked' || ls === 'booked' || ls === 'demo_scheduled') && 
             new Date(c.updated_at || c.created_at) >= today;
    }).length;
    const hot = state.contacts.filter(c => c.urgency === 'hot').length;
    
    // Pipeline = sum of deal_value for non-lost leads
    const pipeline = state.contacts.reduce((sum, c) => {
      const fs = (c.follow_up_status || '').toLowerCase();
      if (fs === 'lost' || fs === 'won') return sum;
      return sum + (Number(c.deal_value) || 0);
    }, 0);
    
    return { newLeads, calls, booked, hot, pipeline };
  }

  function renderConversation(items) {

                    📞 ${c.call_type === 'inbound' || !c.call_type ? 'Called in' : 'Riley called'} · ${escapeHtml(c.call_status || 'completed')}
                  </span>
                  <span style="font-size:11px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;">${escapeHtml(fmt.when(c.created_at))} · ${escapeHtml(fmt.duration(c.duration_seconds))}</span>
                </div>
                ${c.summary ? `<div style="font-size:12.5px;color:var(--ink-soft);line-height:1.55;">${escapeHtml(c.summary)}</div>` : ''}
                ${c.recording_url ? `<a href="${escapeAttr(c.recording_url)}" target="_blank" style="font-size:11.5px;color:var(--accent);text-decoration:none;display:inline-block;margin-top:6px;">▶ Listen to recording</a>` : ''}
              </div>
            `;
          } else {
            const s = item.data;
            const isInbound = s.direction === 'inbound';
            return `
              <div style="display:flex;flex-direction:column;align-items:${isInbound ? 'flex-start' : 'flex-end'};gap:2px;">
                <div class="bubble ${isInbound ? 'bubble-them' : 'bubble-us'}">
                  ${s.message ? escapeHtml(s.message) : "<span style='opacity:0.6;font-style:italic;'>(no content)</span>"}
                </div>
                <div class="bubble-meta">${escapeHtml(fmt.timeOnly(s.created_at))} · ${isInbound ? 'them' : 'sent'}</div>
              </div>
            `;
          }
        }).join('')}
      </div>
    `;
  }
  
  function formatActivity(a) {
    const type = a.action_type;
    const data = a.action_data || {};
    
    if (type === 'note_added') return 'Added a note';
    if (type === 'status_changed') return `Changed status to <strong>${escapeHtml(fmt.industry(data.follow_up_status || ''))}</strong>`;
    if (type === 'call_logged') return 'Called the lead';
    if (type === 'text_logged') return 'Texted the lead';
    if (type === 'reminder_set') return `Set callback for ${data.callback_at ? escapeHtml(fmt.fullDate(data.callback_at)) : 'later'}`;
    if (type === 'tag_added') return `Added tag: <strong>${escapeHtml(data.tag || '')}</strong>`;
    if (type === 'tag_removed') return `Removed tag: <strong>${escapeHtml(data.tag || '')}</strong>`;
    if (type === 'deal_value_set') return `Set value to ${escapeHtml(fmt.money(data.deal_value))}`;
    if (type === 'assignee_set') return `Assigned to ${escapeHtml(data.assigned_to || 'someone')}`;
    if (type === 'followed_up') return 'Marked as followed up';
    return escapeHtml(type.replace(/_/g, ' '));
  }
  
  function renderModal() {
    const m = state.showModal;
    const c = state.contacts.find(x => x.id === m.contactId);
    if (!c) return '';
    
    if (m.type === 'reminder') {
      return `
        <div class="modal-overlay" onclick="window.client.closeModal()">
          <div class="modal" onclick="event.stopPropagation()">
            <h3 class="font-display" style="font-size:22px;margin:0 0 6px 0;font-weight:500;">Set a reminder</h3>
            <p style="font-size:13px;color:var(--ink-mute);margin:0 0 18px 0;">Follow up with ${escapeHtml(c.name || 'this lead')} later.</p>
            
            <div style="margin-bottom:14px;">
              <label class="eyebrow" style="display:block;margin-bottom:6px;">When?</label>
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;">
                <button class="btn-secondary" onclick="window.client.setReminder('${c.id}', 'tomorrow_9am')">Tomorrow 9am</button>
                <button class="btn-secondary" onclick="window.client.setReminder('${c.id}', 'in_3_days')">In 3 days</button>
                <button class="btn-secondary" onclick="window.client.setReminder('${c.id}', 'next_week')">Next week</button>
              </div>
              <input type="datetime-local" class="input" id="reminder-custom" />
            </div>
            
            <div style="display:flex;justify-content:flex-end;gap:8px;">
              <button class="btn-secondary" onclick="window.client.closeModal()">Cancel</button>
              <button class="btn-primary" onclick="window.client.setReminderCustom('${c.id}')">Set Reminder</button>
            </div>
          </div>
        </div>
      `;
    }
    
    if (m.type === 'tag') {
      return `
        <div class="modal-overlay" onclick="window.client.closeModal()">
          <div class="modal" onclick="event.stopPropagation()">
            <h3 class="font-display" style="font-size:22px;margin:0 0 6px 0;font-weight:500;">Add a tag</h3>
            <p style="font-size:13px;color:var(--ink-mute);margin:0 0 18px 0;">Tags help you organize and find leads later.</p>
            
            <input type="text" class="input" id="new-tag-input" placeholder="e.g., VIP, referral, returning..." autofocus
                   onkeydown="if(event.key==='Enter') window.client.addTag('${c.id}', this.value)" />
            
            <div style="margin-top:12px;">
              <div class="eyebrow" style="margin-bottom:6px;">Common tags</div>
              <div style="display:flex;gap:5px;flex-wrap:wrap;">
                ${['VIP', 'Referral', 'Returning', 'Big Deal', 'Follow Up', 'Hot'].map(t => 
                  `<button class="tag" style="cursor:pointer;" onclick="window.client.addTag('${c.id}', '${escapeAttr(t)}')">${escapeHtml(t)}</button>`
                ).join('')}
              </div>
            </div>
            
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
              <button class="btn-secondary" onclick="window.client.closeModal()">Cancel</button>
              <button class="btn-primary" onclick="window.client.addTag('${c.id}', document.getElementById('new-tag-input').value)">Add Tag</button>
            </div>
          </div>
        </div>
      `;
    }
    return '';
  }
  
  function fmtDuration(sec) {
    if (!sec) return '—';
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }
  fmt.duration = fmtDuration;
  
  // ─────── Public API ───────
  window.client = {
    async login() {
      const input = document.getElementById('pw-input');
      const errEl = document.getElementById('login-err');
      const pw = input?.value || '';
      
      if (pw === window.DASHBOARD_PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, 'authenticated');
        state.authenticated = true;
        await load();
      } else {
        if (errEl) {
          errEl.textContent = 'Incorrect password';
          errEl.style.display = 'block';
        }
        if (input) { input.value = ''; input.focus(); }
      }
    },
    logout() {
      sessionStorage.removeItem(SESSION_KEY);
      location.reload();
    },
    refresh() { load(); },
    setView(v) {
      state.view = v;
      state.selectedId = null;
      render();
    },
    search(q) { state.searchQuery = q; render(); },
    select(id) {
      state.selectedId = state.selectedId === id ? null : id;
      render();
    },
    
    async saveNotes(id, text) {
      const c = state.contacts.find(x => x.id === id);
      if (c?.notes === text) return;
      await updateContact(id, { notes: text }, 'note_added');
    },
    async setStatus(id, status) {
      if (!status) return;
      await updateContact(id, { follow_up_status: status }, 'status_changed');
    },
    async setDealValue(id, value) {
      const v = value ? parseFloat(value) : null;
      const c = state.contacts.find(x => x.id === id);
      if ((c?.deal_value || null) === v) return;
      await updateContact(id, { deal_value: v }, 'deal_value_set');
    },
    async setAssignee(id, person) {
      const c = state.contacts.find(x => x.id === id);
      if ((c?.assigned_to || '') === person) return;
      await updateContact(id, { assigned_to: person || null }, 'assignee_set');
    },
    async markFollowedUp(id) {
      await updateContact(id, { follow_up_status: 'followed_up' }, 'followed_up');
    },
    async logCall(id) {
      await updateContact(id, { follow_up_status: 'followed_up' }, 'call_logged');
    },
    async logText(id) {
      await updateContact(id, { follow_up_status: 'followed_up' }, 'text_logged');
    },
    
    openModal(type, contactId) {
      state.showModal = { type, contactId };
      render();
    },
    closeModal() {
      state.showModal = null;
      render();
    },
    
    async setReminder(id, preset) {
      let dt = new Date();
      if (preset === 'tomorrow_9am') {
        dt.setDate(dt.getDate() + 1);
        dt.setHours(9, 0, 0, 0);
      } else if (preset === 'in_3_days') {
        dt.setDate(dt.getDate() + 3);
      } else if (preset === 'next_week') {
        dt.setDate(dt.getDate() + 7);
      }
      await updateContact(id, { callback_at: dt.toISOString() }, 'reminder_set');
      state.showModal = null;
      render();
    },
    async setReminderCustom(id) {
      const input = document.getElementById('reminder-custom');
      if (!input?.value) return;
      const dt = new Date(input.value);
      await updateContact(id, { callback_at: dt.toISOString() }, 'reminder_set');
      state.showModal = null;
      render();
    },
    
    async addTag(id, tag) {
      const t = (tag || '').trim();
      if (!t) return;
      const c = state.contacts.find(x => x.id === id);
      const current = c?.tags || [];
      if (current.includes(t)) {
        state.showModal = null;
        render();
        return;
      }
      const newTags = [...current, t];
      await updateContact(id, { tags: newTags }, 'tag_added');
      const input = document.getElementById('new-tag-input');
      if (input) input.value = '';
      state.showModal = null;
      render();
    },
    async removeTag(id, tag) {
      const c = state.contacts.find(x => x.id === id);
      const current = c?.tags || [];
      const newTags = current.filter(t => t !== tag);
      await updateContact(id, { tags: newTags }, 'tag_removed');
    }
  };
  
  // ─────── Boot ───────
  state.authenticated = sessionStorage.getItem(SESSION_KEY) === 'authenticated';
  if (state.authenticated) {
    load();
    setInterval(load, 30000);
  } else {
    render();
  }
  
})();
</script>

</body>
</html>
