<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ledger — Daily Income Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['Manrope', 'ui-sans-serif', 'system-ui'],
        mono: ['"JetBrains Mono"', 'ui-monospace'],
      },
      colors: {
        ink: {
          0: '#04060d',
          50: '#070a14',
          100: '#0b0f1c',
          200: '#111626',
          300: '#1a2034',
          400: '#252c44',
        },
      },
    },
  },
};
</script>
<style>
  :root {
    --bg: #04060d;
    --surface: rgba(255, 255, 255, 0.03);
    --surface-2: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.12);
    --text: #e7ecf3;
    --muted: #8893ab;
    --dim: #5b6786;
    --pos: oklch(0.80 0.16 155);
    --pos-soft: oklch(0.80 0.16 155 / 0.14);
    --neg: oklch(0.72 0.18 25);
    --neg-soft: oklch(0.72 0.18 25 / 0.14);
    --warn: oklch(0.82 0.16 80);
    --warn-soft: oklch(0.82 0.16 80 / 0.14);
    --iris: oklch(0.74 0.16 265);
    --iris-soft: oklch(0.74 0.16 265 / 0.16);
  }
  html, body, #root { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', system-ui, sans-serif;
    font-feature-settings: 'ss01', 'cv11';
    -webkit-font-smoothing: antialiased;
    margin: 0;
  }
  /* Ambient backdrop */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(900px 600px at 12% -10%, oklch(0.74 0.16 265 / 0.18), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, oklch(0.80 0.16 155 / 0.10), transparent 60%),
      radial-gradient(800px 600px at 100% 110%, oklch(0.72 0.18 25 / 0.08), transparent 65%);
  }
  .glass {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015)),
      rgba(8, 11, 22, 0.6);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 20px 60px -30px rgba(0,0,0,0.6);
    backdrop-filter: blur(14px);
  }
  .glass-soft {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .num { font-family: 'JetBrains Mono', ui-monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .hairline { border-color: var(--border); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }
  ::-webkit-scrollbar-track { background: transparent; }
  /* Sticky table header */
  .stick th { position: sticky; top: 0; background: #0a0e1a; z-index: 5; }
  /* Inputs */
  .field {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13.5px;
    outline: none;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .field:focus { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); box-shadow: 0 0 0 4px rgba(255,255,255,0.04); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-weight: 600; font-size: 13.5px;
    transition: background .15s, border-color .15s, transform .05s;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,0.08); }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: linear-gradient(180deg, oklch(0.84 0.16 155), oklch(0.72 0.16 155));
    color: #04130a; border-color: transparent;
    box-shadow: 0 6px 20px -10px oklch(0.80 0.16 155 / 0.5);
  }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  /* tab active */
  .tab-active {
    color: var(--text);
    background: rgba(255,255,255,0.05);
    border-color: var(--border-strong);
  }
  /* row hover */
  tbody tr.row { transition: background .12s; }
  tbody tr.row:hover { background: rgba(255,255,255,0.025); }
  /* progress bar shimmer */
  .bar-track { background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }

  /* Calendar */
  .cal-cell {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 9px;
    background: rgba(255,255,255,0.015);
    min-height: 78px;
    display: flex; flex-direction: column;
    transition: transform .12s, border-color .12s, background .12s;
  }
  .cal-cell:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.04); }
  .cal-cell.today { border-color: oklch(0.74 0.16 265 / 0.65); box-shadow: 0 0 0 1px oklch(0.74 0.16 265 / 0.35) inset; }
  .cal-cell.muted { opacity: 0.45; }
  .cal-cell.pos { background: linear-gradient(180deg, oklch(0.80 0.16 155 / 0.08), oklch(0.80 0.16 155 / 0.02)); }
  .cal-cell.neg { background: linear-gradient(180deg, oklch(0.72 0.18 25 / 0.08), oklch(0.72 0.18 25 / 0.02)); }

  /* Modal */
  .scrim {
    position: fixed; inset: 0; background: rgba(2,4,10,0.6);
    backdrop-filter: blur(6px); z-index: 50;
    display: flex; align-items: center; justify-content: center;
  }
  /* small util */
  .truncate2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* selection */
  ::selection { background: oklch(0.74 0.16 265 / 0.35); color: white; }
</style>
</head>
<body>
<div id="root"></div>

</body>
